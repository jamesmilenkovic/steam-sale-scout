<title>What should I play next?</title>

<!--
  Steam Sale Scout – the answer page (Increment 12).

  ONE SCREEN THAT ANSWERS "what should I play next" BEFORE ANYONE TOUCHES
  ANYTHING ON IT. The gate this file exists for, verbatim from SPEC.md §1:
  a stranger can land on the front page and get a usable answer without
  touching a single control.

  WHAT REPLACED WHAT. The six tabs (Deals / Recs / Best of Steam / Library /
  Wishlist / FPM) are gone from the UI. Their ROUTES are untouched and still
  tested – SPEC.md §6 deletes the UI this increment and the handlers at 13,
  so that if this page is wrong about a field the old one is still there to
  compare against.

  THREE RULES THIS FILE OBEYS, ALL REVIEWER-CHECKABLE:
    1. THE BROWSER NEVER COMPUTES A RANK (SPEC.md §4.2). There is no blend
       arithmetic anywhere under public/. Lens changes re-FETCH with
       ?preset=. Sorting the browse table on a returned field is
       presentation and is allowed; recomputing rankScore is not.
    2. NO FRAMEWORK, NO BUNDLER, NO CDN (SPEC.md §2, §6). One static file
       plus one ESM module, both served from ./public by the Worker's assets
       binding. The suite is provably offline-clean and the app must run with
       the network down.
    3. EVERY FIXED STRING WAS RULED BY JAMES at checkpoint 01 before this
       markup existed (SPEC.md §10c). The strings live in rankFilters.js with
       tests, not inline here, so a ruling cannot drift silently.
-->

<style>
  :root {
    --ink: #1a1a1a;
    --muted: #666;
    --line: #e0e0e0;
    --accent: #2a6df5;
    --surface: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 2rem auto 4rem;
    padding: 0 1rem;
    color: var(--ink);
    line-height: 1.45;
  }
  h1 { margin: 0 0 0.35rem; font-size: 2rem; }
  .basis { color: var(--muted); margin: 0 0 1.25rem; max-width: 62ch; }

  /* ---- The lens strip (SPEC.md §4.2) ---- */
  .lenses { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .lens {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
  }
  .lens[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .lens[disabled] { opacity: 0.45; cursor: not-allowed; }
  .lens-subline { color: var(--muted); font-size: 0.9rem; margin: 0.5rem 0 0; min-height: 1.3em; }

  /* ---- The two quick chips (SPEC.md §4.3) ---- */
  .chips { display: flex; gap: 1.25rem; flex-wrap: wrap; margin: 0.75rem 0 1.5rem; font-size: 0.95rem; }
  .chips label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }

  /* ---- The picks. TEN cards, each exactly three text lines. ---- */
  .pick {
    display: grid;
    grid-template-columns: 2.1rem 1fr;
    gap: 0 0.6rem;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--line);
  }
  .pick-n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 1.05rem; padding-top: 0.05rem; }
  .pick-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .pick-title { font-size: 1.05rem; font-weight: 600; text-decoration: none; color: var(--ink); }
  .pick-title:hover { color: var(--accent); text-decoration: underline; }
  .pick-status { color: var(--muted); font-size: 0.9rem; white-space: nowrap; text-align: right; }
  .pick-why { margin: 0.15rem 0 0.2rem; }
  .pick-facts { color: var(--muted); font-size: 0.88rem; display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
  .pick-actions { display: flex; gap: 0.75rem; white-space: nowrap; }
  .pick-actions a, .pick-actions button {
    font-size: 0.85rem; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; text-decoration: none;
  }
  .pick-actions a:hover, .pick-actions button:hover { text-decoration: underline; }
  .mark {
    display: inline-block; font-size: 0.75rem; padding: 0.05rem 0.4rem; border-radius: 3px;
    background: var(--surface); color: #555; margin-left: 0.4rem; cursor: help;
  }
  .mark-wish { background: #e8f0fe; color: #1a4fb4; cursor: default; }

  /* ---- Banners, notices, states ---- */
  .banner {
    background: #fff8e1; border: 1px solid #e6cf7a; border-radius: 6px;
    padding: 0.85rem 1rem; margin: 0 0 1.25rem;
  }
  .banner p { margin: 0; font-weight: 600; }
  .banner .verbatim { margin: 0.5rem 0 0; font-weight: 400; font-size: 0.85rem; color: #6b5a1f; }
  .status { color: var(--muted); font-style: italic; padding: 1rem 0; }
  .error { color: #900; background: #fdeaea; border: 1px solid #f0b8b8; padding: 0.75rem; border-radius: 6px; }
  .error p { margin: 0; }
  .error .verbatim { margin: 0.5rem 0 0; font-size: 0.85rem; color: #7a3a3a; }
  .toast { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
  .toast button { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 0.9rem; }

  .more { display: block; margin: 1.25rem auto; padding: 0.5rem 1.25rem; background: #fff; border: 1px solid var(--line); border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
  /* `display: block` above beats the UA stylesheet's `[hidden] { display: none }`,
     so `.hidden = true` on these two buttons did nothing and an EMPTY PILL was
     left on screen - most visibly under the error box, where the page has
     nothing to show. Found while capturing the database-down state; not on the
     review list. */
  .more[hidden] { display: none; }

  /* ---- Browse, one click below (SPEC.md §4.4, §4.5) ---- */
  details.browse { border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 1.5rem; }
  details.browse > summary { cursor: pointer; font-weight: 600; }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 0.6rem 1.25rem; background: var(--surface); border-radius: 6px; padding: 0.9rem; margin: 1rem 0;
    font-size: 0.9rem;
  }
  .filters label { display: flex; flex-direction: column; gap: 0.2rem; }
  .filters .inline { flex-direction: row; align-items: center; gap: 0.4rem; }
  .tagchips { display: flex; flex-wrap: wrap; gap: 0.35rem; grid-column: 1 / -1; }
  .tagchip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0.15rem 0.6rem; font-size: 0.8rem; cursor: pointer; }
  .tagchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .browse-count { color: var(--muted); font-size: 0.9rem; margin: 0.5rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.3rem 0.45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: #fff; cursor: pointer; white-space: nowrap; }
  th[aria-sort] { color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.why { color: var(--muted); max-width: 26ch; }

  /* ---- The honest footer (SPEC.md §4.1.7) ---- */
  footer { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: 1rem; color: var(--muted); font-size: 0.88rem; }
  footer ul { margin: 0.5rem 0 0; padding-left: 1.1rem; }
  footer summary { cursor: pointer; }
  /* Increment 12.5. The two mark toggles are SECONDARY WEIGHT on the card -
     smaller than "View on Steam", never competing with the reason line, and
     never adding a fourth line to a card (SPEC-12 §10b.1 keeps ten cards
     scannable). An active toggle is bold and carries a tick, because colour
     alone is not enough on a text button. */
  .pick-actions button[aria-pressed="true"] { font-weight: 600; }
  details.tocheck { margin: 0.8rem 0; }
  details.tocheck > summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  .tocheck-why { color: var(--muted); font-size: 0.85rem; margin: 0.3rem 0; }
  .tocheck-list { margin: 0.3rem 0; padding-left: 1.2rem; }
  .tocheck-list li { margin-bottom: 0.25rem; font-size: 0.9rem; }
  .tocheck-list .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-marks button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 0.75rem; padding: 0 0 0 0.4rem;
  }
  .row-marks button[aria-pressed="true"] { font-weight: 600; }
  .dismissed-list { margin-top: 0.6rem; }
  .dismissed-list li { margin-bottom: 0.2rem; }
</style>

<h1>What should I play next?</h1>

  <summary id="browse-summary">Browse all games</summary>

  <div class="filters" id="filters">

<footer id="footer"></footer>

<script type="module">
  import {
    PICK_COUNT, PICK_STEP, LANDING_PRESET, LENSES, BROWSE_PAGE_SIZE,
    DEFAULT_RANK_FILTERS, RANK_FILTERS_SETTINGS_KEY, normaliseFilters,
    OWNERSHIP_ALL, applyRankFilters, selectPicks, selectTop100, computeTopTags,
    tasteBand, statusLine, lengthLine, experienceLine, tagLine, perHourCell,
    ownedCell, sortRows, confidenceTitle, steamUrl, basisSentence, formatCount,
    formatPrice, footerLine, funnelBreakdown, libraryBanner, libraryState,
    similarityLensEnabled, similarityDisabledReason,
    LIBRARY_STATE_FETCH_FAILED,
    isRenderablePayload, unavailableMessage, RANK_UNAVAILABLE_LEAD,
    PLAY_STATES, PLAY_STATE_ALL, applyMark, gamesToCheck, GAMES_TO_CHECK_WINDOW,
  } from "./rankFilters.js";

  // -------------------------------------------------------------------------
  // State. One fetch per lens, held in memory for the session (SPEC.md §5.1):
  // all rows arrive at once and every filter is then instant, which is worth
  // more than a smaller first payload. Pagination is increment 13's.
  // -------------------------------------------------------------------------
  const state = {
    preset: LANDING_PRESET,
    payloads: new Map(),          // preset -> the whole /api/rank response
    chips: { hideOwned: false, hidePlayed: false },
    filters: { ...DEFAULT_RANK_FILTERS },
    picksShown: PICK_COUNT,
    browseShown: BROWSE_PAGE_SIZE,
    wishlist: new Set(),          // painted in later, never blocking
    sort: { key: null, dir: "desc" },
    lastDismissed: null,
  };

  const $ = (id) => document.getElementById(id);
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    // textContent, NEVER markup: a game title, a tag and an LLM reason line are
    // all upstream data, and this is the only place text enters the document.
    // A test greps this whole file for every HTML-parsing sink (SEC-6), so
    // the rule is pinned rather than merely observed.
    if (text != null) node.textContent = text;
    return node;
  };

  const payload = () => state.payloads.get(state.preset);
  const rows = () => payload()?.rank ?? [];

  // -------------------------------------------------------------------------
  // Loading. §10c.3: "Reading the game catalogue…" with NO count – the number
  // only arrives with the payload, so printing one during the load would mean
  // hardcoding a constant that drifts at the next crawl.
  // -------------------------------------------------------------------------
  let slowTimer = null;
  function showLoading() {
    const node = el("p", "status", "Reading the game catalogue…");
    $("picks").replaceChildren(node);
    clearTimeout(slowTimer);
    slowTimer = setTimeout(() => {
      // Cold start is ~30s and is increment 13's problem (SPEC.md §5). Saying
      // so beats a spinner that implies something is wrong.
      node.textContent = "Reading the game catalogue… the first load after a server restart can take up to 30 seconds.";
    }, 5000);
  }

  /** Thrown when /api/rank answered, honestly, that it has no answer. It
   * carries the server's own words so the page can print them instead of
   * guessing at a cause. */
  class RankUnavailable extends Error {
    constructor(payload) {
      super("rank unavailable");
      this.detail = unavailableMessage(payload);
    }
  }

  async function loadPreset(preset) {
    if (state.payloads.has(preset)) return;
    showLoading();
    const res = await fetch(`/api/rank?preset=${encodeURIComponent(preset)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const body = await res.json();
    clearTimeout(slowTimer);
    // /api/rank FAIL-SOFTS AT HTTP 200 (SEC-2). `res.ok` is true for
    // `{available:false, notice:"Ranking unavailable"}`, which has no `funnel`
    // and no `rank`. Storing that as a payload made the render throw on
    // `p.funnel.ranked` and the boot catch then blamed a cold start – a
    // database failure reported as a slow start, with a remedy that can never
    // work. Validate the shape here, once, and let the notice speak.
    if (!isRenderablePayload(body)) throw new RankUnavailable(body);
    state.payloads.set(preset, body);
  }

  /**
   * The honest failure paint. Used by boot and by a lens change, so the two
   * cannot drift apart. Two shapes, and which one you get is the whole SEC-2
   * fix:
   *
   *   * THE FETCH NEVER LANDED – no response at all. "The server may still be
   *     starting up" is a fair guess and the cold start really is ~38 s.
   *   * /api/rank ANSWERED AND SAID IT HAS NO RANKING – a missing FPM_DB or a
   *     D1 throw, at HTTP 200. Reloading cannot fix that, so it must not be
   *     suggested. §10c.2's pattern: the plain sentence leads, the server's
   *     own words follow verbatim as technical detail.
   */
  function showFailure(err) {
    clearTimeout(slowTimer);
    const box = el("div", "error");
    if (err instanceof RankUnavailable) {
      box.append(el("p", null, RANK_UNAVAILABLE_LEAD));
      box.append(el("p", "verbatim", err.detail));
    } else {
      // QA advisory, 2026-09-05. This branch used to claim "the server may
      // still be starting up" for EVERY non-RankUnavailable error, including
      // an HTTP 500 - and a 500 means the server answered, so that was the
      // same lie A2 removed from the database-down path, one rung down. The
      // page cannot tell a cold start from a crash, so it says only what it
      // knows and offers the one action that sometimes helps, without
      // promising it will.
      box.append(el("p", null, "The page could not read the game catalogue. Reloading may help; if it does not, the server is not answering properly."));
    }
    $("picks").replaceChildren(box);
    $("show-more").hidden = true;
  }

  // -------------------------------------------------------------------------
  // Render.
  // -------------------------------------------------------------------------
  function renderLenses() {
    const enabled = similarityLensEnabled(payload());
    const strip = $("lenses");
    strip.replaceChildren();
    for (const lens of LENSES) {
      const btn = el("button", "lens", lens.label);
      btn.setAttribute("aria-pressed", String(lens.preset === state.preset));
      // The similarity lens needs a taste profile to mean anything, so with no
      // library it is disabled WITH ITS REASON ON IT rather than silently
      // serving a taste-blind list under a taste-shaped label (SPEC.md §4.6).
      if (lens.preset === "similarity" && !enabled) {
        btn.disabled = true;
        btn.title = similarityDisabledReason(payload());
      }
      btn.addEventListener("click", () => selectLens(lens.preset));
      strip.append(btn);
      if (lens.preset === "similarity" && !enabled) {
        strip.append(el("span", "lens-subline", similarityDisabledReason(payload())));
      }
    }
    $("lens-subline").textContent = LENSES.find((l) => l.preset === state.preset)?.subline ?? "";
  }

  function renderBanner() {
    const slot = $("banner-slot");
    slot.replaceChildren();
    const text = libraryBanner(payload());
    if (!text) return;
    const box = el("div", "banner");
    box.append(el("p", null, text));
    // §10c.2: the plain sentence leads; the payload's own `notice` follows
    // VERBATIM as technical detail. src/ is frozen so the notice cannot be
    // rewritten at source, and it says "taste profile", "similarity is 0" and
    // "lens" – three phrases a first-time reader has never met. Gate 3 still
    // finds the exact string on the page.
    if (libraryState(payload()) === LIBRARY_STATE_FETCH_FAILED) {
      box.append(el("p", "verbatim", payload().notice));
    }
    slot.append(box);
  }

  /** One pick card. Three text lines, always, so ten of them stay scannable
   * (SPEC.md §10b.1 – ten cards is a list, and what keeps it reading as an
   * answer is that each card is the same shape). */
  function renderPick(row, index) {
    const card = el("div", "pick");
    card.append(el("div", "pick-n", String(index + 1)));

    const body = el("div");

    const head = el("div", "pick-head");
    const link = el("a", "pick-title", row.title);
    link.href = steamUrl(row.appid);
    link.target = "_blank";
    link.rel = "noopener";
    const titleWrap = el("span");
    titleWrap.append(link);
    if (state.wishlist.has(row.appid)) titleWrap.append(el("span", "mark mark-wish", "On your wishlist"));
    if (row.confidence === "low") {
      const mark = el("span", "mark", "rough score");
      mark.title = confidenceTitle(row);
      titleWrap.append(mark);
    }
    head.append(titleWrap, el("span", "pick-status", statusLine(row)));
    body.append(head);

    // THE MOST LOAD-BEARING STRING ON THE PAGE (SPEC.md §4.1). The LLM's
    // reason line, verbatim, never truncated, alone on its own full-width
    // line so nothing competes with it.
    body.append(el("p", "pick-why", `“${row.why ?? ""}”`));

    // §10c.1: taste match is OFF the card. On the real top ten it read
    // "Strong" six times and "Very strong" four – the top of the list IS the
    // best-matching set, so the slot repeated itself while looking like
    // information. The raw number stays in the browse table.
    const facts = el("div", "pick-facts");
    facts.append(el("span", null, [lengthLine(row), experienceLine(row), tagLine(row)].filter(Boolean).join(" · ")));

    const actions = el("div", "pick-actions");
    const view = el("a", null, "View on Steam");
    view.href = steamUrl(row.appid);
    view.target = "_blank";
    view.rel = "noopener";
    // INCREMENT 12.5. The two toggles, at secondary weight, in the actions row
    // that already exists. They are ON THE CARD rather than behind a "Mark…"
    // menu because the 297 problem is DISCOVERED on the front page - that is
    // literally how this increment got triggered, with Portal sitting at pick
    // #6 saying "never played". A menu would cost an extra click on the one
    // interaction this whole increment exists to make cheap.
    const played = markButton(row, "played");
    const finished = markButton(row, "finished");
    const dismiss = el("button", null, "Not interested");
    dismiss.addEventListener("click", () => dismissRow(row));
    actions.append(view, played, finished, dismiss);
    facts.append(actions);
    body.append(facts);

    card.append(body);
    return card;
  }

  function renderPicks() {
    const picks = selectPicks(rows(), state.chips, state.picksShown);
    const host = $("picks");
    host.replaceChildren();
    if (picks.length === 0) {
      host.append(el("p", "status", "No picks left with those filters on. Turn one off."));
      $("show-more").hidden = true;
      return;
    }
    picks.forEach((row, i) => host.append(renderPick(row, i)));
    const total = selectPicks(rows(), state.chips, Infinity).length;
    const more = $("show-more");
    more.hidden = picks.length >= total;
    more.textContent = `Show me ${PICK_STEP} more`;
  }

  // -------------------------------------------------------------------------
  // Browse. Filtering runs over the FULL in-memory array; only the RENDERED
  // WINDOW is capped, so a filter finds a match at rank 9,000 (SPEC.md §4.4).
  // -------------------------------------------------------------------------
  const COLUMNS = [
    { key: null, label: "#", num: true, cell: (r, i) => String(i + 1) },
    { key: "title", label: "Game", cell: (r) => r.title },
    { key: "experienceScore", label: "Experience", num: true, cell: (r) => r.experienceScore ?? "–" },
    { key: "gameScore", label: "Quality", num: true, cell: (r) => r.gameScore ?? "–" },
    { key: "hoursToValue", label: "Hours", num: true, cell: (r) => r.hoursToValue ?? "–" },
    { key: "similarityNorm", label: "Taste match", num: true, cell: (r) => `${(r.similarityNorm ?? 0).toFixed(2)} ${tasteBand(r.similarityNorm)}` },
    { key: "experienceFpm", label: "Per hour", num: true, cell: (r) => perHourCell(r) },
    // CR-4 / TC-4: this used to be `statusLine(r).replace("In your library – ", "")`
    // – string surgery that hard-coded another module's separator. `ownedCell`
    // and `statusLine` now share one `playedFragment`, and a test asserts the
    // composition, so re-ruling the separator cannot silently make this column
    // print the whole sentence.
    { key: "owned", label: "Yours", cell: (r) => ownedCell(r) },
    { key: "price", label: "Price", cell: (r) => (r.owned ? "" : r.price == null ? "–" : `${formatPrice(r.price)}${r.cut > 0 ? ` (-${Math.round(r.cut)}%)` : ""}`) },
    { key: null, label: "Why", cell: (r) => r.why ?? "", why: true },
  ];

  function renderBrowse() {
    const all = rows();
    // The comparator itself lives in rankFilters.js and is tested in both
    // directions (CR-3 / TC-3). §4.4's "nulls sort LAST in both directions so
    // an endless game is never mistaken for a zero" is a named obligation, and
    // it was unasserted while it sat in this file.
    const filtered = sortRows(applyRankFilters(all, state.filters), state.sort);

    const head = $("browse-head");
    head.replaceChildren();
    for (const col of COLUMNS) {
      const th = el("th", col.num ? "num" : null, col.label);
      if (col.key) {
        if (state.sort.key === col.key) th.setAttribute("aria-sort", state.sort.dir === "asc" ? "ascending" : "descending");
        th.addEventListener("click", () => {
          state.sort = state.sort.key === col.key
            ? { key: col.key, dir: state.sort.dir === "desc" ? "asc" : "desc" }
            : { key: col.key, dir: "desc" };
          renderBrowse();
        });
      } else {
        th.style.cursor = "default";
      }
      head.append(th);
    }

    const body = $("browse-body");
    body.replaceChildren();
    if (filtered.length === 0) {
      const tr = el("tr");
      const td = el("td", null, "No games match those filters.");
      td.colSpan = COLUMNS.length;
      tr.append(td);
      body.append(tr);
    }
    filtered.slice(0, state.browseShown).forEach((row, i) => {
      const tr = el("tr");
      for (const col of COLUMNS) {
        const td = el("td", [col.num ? "num" : null, col.why ? "why" : null].filter(Boolean).join(" "));
        if (col.label === "Game") {
          const a = el("a", null, row.title);
          a.href = steamUrl(row.appid);
          a.target = "_blank";
          a.rel = "noopener";
          td.append(a);
          if (row.confidence === "low") {
            const mark = el("span", "mark", "rough score");
            mark.title = confidenceTitle(row);
            td.append(mark);
          }
          // Increment 12.5: the same two toggles per row, at row weight. The
          // "Yours" column beside them reads from the same `playedFragment`
          // the card's status line uses, so a mark can never say one thing in
          // the table and another on the card.
          const marks = el("span", "row-marks");
          marks.append(markButton(row, "played"), markButton(row, "finished"));
          const dismiss = el("button", null, "Not interested");
          dismiss.style.cssText = "background:none;border:none;color:#2a6df5;cursor:pointer;font-size:0.75rem;padding:0 0 0 0.4rem;";
          dismiss.addEventListener("click", () => dismissRow(row));
          td.append(marks, dismiss);
        } else {
          td.textContent = String(col.cell(row, i));
        }
        tr.append(td);
      }
      body.append(tr);
    });

    // Top-100 says how many it FOUND rather than claiming 100 (SPEC.md §4.5.10).
    const label = state.filters.top100
      ? `Top ${formatCount(selectTop100(all).length)} of all time – showing ${formatCount(Math.min(filtered.length, state.browseShown))} of ${formatCount(filtered.length)} after filters.`
      : `Showing ${formatCount(Math.min(filtered.length, state.browseShown))} of ${formatCount(filtered.length)} games`;
    $("browse-count").textContent = label;

    const more = $("browse-more");
    more.hidden = filtered.length <= state.browseShown;
  }

  /**
   * "Games to check" - what turns 297 into a finite job.
   *
   * MEASURED, NOT ASSUMED (2026-09-05, live): of the 297 owned games Steam has
   * no record of, FIVE are in the top 50, sixteen in the top 200 and 62 in the
   * top 1,000. An unmarked game costs exactly one thing - it can appear as a
   * pick for a game already played - so the work is bounded by the top of the
   * ranking, not by the size of the library. James ruled the window at 50.
   *
   * It reads the CURRENT LENS's rank order, so "in your way" means in your way
   * on the list you are actually looking at.
   */
  function renderGamesToCheck() {
    const all = rows();
    const list = gamesToCheck(all);
    $("tocheck-summary").textContent = `Games to check (${formatCount(list.length)} in your top ${GAMES_TO_CHECK_WINDOW})`;
    const host = $("tocheck-list");
    host.replaceChildren();
    if (list.length === 0) {
      host.append(el("li", null, `Nothing to check – every owned game in your top ${GAMES_TO_CHECK_WINDOW} has a play record or a mark.`));
      return;
    }
    for (const row of list) {
      const li = el("li");
      li.append(el("span", "rank", `#${all.indexOf(row) + 1}  `));
      const link = el("a", null, row.title);
      link.href = steamUrl(row.appid);
      link.target = "_blank";
      link.rel = "noopener";
      li.append(link);
      const marks = el("span", "row-marks");
      marks.append(markButton(row, "played"), markButton(row, "finished"));
      li.append(marks);
      host.append(li);
    }
  }

  function renderTagChips() {
    const host = $("f-tags");
    if (host.childElementCount > 0) return;   // built once from the whole pool
    for (const { name } of computeTopTags(rows())) {
      const chip = el("button", "tagchip", name);
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(state.filters.includeTags.includes(name)));
      chip.addEventListener("click", () => {
        const on = state.filters.includeTags.includes(name);
        state.filters.includeTags = on
          ? state.filters.includeTags.filter((t) => t !== name)
          : [...state.filters.includeTags, name];
        chip.setAttribute("aria-pressed", String(!on));
        state.browseShown = BROWSE_PAGE_SIZE;
        renderBrowse();
        saveFilters();
      });
      host.append(chip);
    }
  }

  function renderFooter() {
    const p = payload();
    const foot = $("footer");
    foot.replaceChildren();
    foot.append(el("p", null, footerLine(p.funnel)));

    const details = el("details");
    details.append(el("summary", null, "What was left out"));
    const ul = el("ul");
    for (const row of funnelBreakdown(p.funnel)) ul.append(el("li", null, row.text));
    details.append(ul);
    foot.append(details);

    if (p.profileAvailable) {
      foot.append(el("p", null, `Your taste is matched from ${formatCount(p.profileGames)} games in your Steam library.`));
    }

    // The retiring Dismissed tab, reduced to a footer line (SPEC.md §4.7).
    const dismissed = el("details");
    const summary = el("summary", null, "Dismissed (…)");
    dismissed.append(summary);
    const list = el("ul", "dismissed-list");
    dismissed.append(list);
    dismissed.addEventListener("toggle", () => { if (dismissed.open) loadDismissals(summary, list); });
    foot.append(dismissed);
    loadDismissals(summary, list, true);
  }

  async function loadDismissals(summary, list, countOnly = false) {
    try {
      const res = await fetch("/api/dismissals");
      const { dismissals = [] } = await res.json();
      summary.textContent = `Dismissed (${formatCount(dismissals.length)})`;
      if (countOnly) return;
      list.replaceChildren();
      if (dismissals.length === 0) {
        list.append(el("li", null, "You haven't dismissed anything yet."));
        return;
      }
      for (const d of dismissals) {
        const li = el("li");
        li.append(el("span", null, `${d.name ?? d.appid} `));
        const restore = el("button", null, "Put it back");
        restore.style.cssText = "background:none;border:none;color:#2a6df5;cursor:pointer;font-size:0.85rem;padding:0;";
        restore.addEventListener("click", async () => {
          // Same shape as the toast's Undo, and the same SEC-1 fix: a 200 with
          // `{restored:false}` used to remove the row from the list while the
          // server still held the dismissal.
          let restored = false;
          try {
            const res = await fetch(`/api/dismissals/${encodeURIComponent(d.appid)}`, { method: "DELETE" });
            restored = res.ok && (await res.json())?.restored === true;
          } catch {
            restored = false;
          }
          if (!restored) {
            restore.textContent = "Try again";
            li.append(el("span", null, " Couldn't put that back."));
            return;
          }
          li.remove();
        });
        li.append(restore);
        list.append(li);
      }
    } catch {
      // Fail-soft: a footer line is never worth a broken page.
    }
  }

  function renderAll() {
    const p = payload();
    // CR-1: the library clause is dropped in both no-library states. It used
    // to render unconditionally, DIRECTLY ABOVE the banner saying these picks
    // are not matched to your taste.
    $("basis").textContent = basisSentence(p.funnel.ranked, libraryState(p));
    $("browse-summary").textContent = `Browse all ${formatCount(p.funnel.ranked)} games`;
    renderBanner();
    renderLenses();
    renderPicks();
    renderTagChips();
    renderBrowse();
    renderGamesToCheck();
    renderFooter();
  }

  // -------------------------------------------------------------------------
  // Actions.
  // -------------------------------------------------------------------------
  async function selectLens(preset) {
    if (preset === state.preset) return;
    // SEC-3: THE ROLLBACK IS THE POINT. `state.preset` has to move before the
    // fetch so the lit button and the loading state agree, but if the fetch
    // fails and it is left moved, `payload()` returns undefined, `rows()`
    // returns [], and the next chip toggle repaints the honest error with
    // "No picks left with those filters on. Turn one off." – a filter
    // explanation for a network failure. Put it back.
    const previous = state.preset;
    state.preset = preset;
    state.picksShown = PICK_COUNT;
    state.browseShown = BROWSE_PAGE_SIZE;
    try {
      // A LENS CHANGE RE-FETCHES. It does not re-sort what is already here:
      // the blend and the similarity normaliser are properties of the lens and
      // they live in src/rank.js (SPEC.md §4.2).
      await loadPreset(preset);
      renderAll();
    } catch (err) {
      state.preset = previous;
      renderLenses();
      showFailure(err);
    }
  }

  // -------------------------------------------------------------------------
  // Increment 12.5 - the two marks.
  //
  // WHY A MARK IS NOT A DISMISSAL, IN THE ONE PLACE A READER WILL WONDER.
  // "Not interested" removes the row from the pool server-side, so the card
  // goes and the next pick slides in. A mark changes NOTHING about the
  // ranking (SPEC.md §2) - the row stays exactly where it is, and only its
  // status line and its toggles change. That difference is the whole reason
  // marks live in their own table and never touch /api/rank's pool.
  // -------------------------------------------------------------------------

  /** One toggle. `which` is "played" or "finished". */
  function markButton(row, which) {
    const on = which === "finished" ? row.finished === true : row.played === true;
    const label = which === "finished" ? "Finished" : "Played";
    const btn = el("button", null, on ? `✓ ${label}` : label);
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(on));
    btn.title = on ? "Click to clear" : `Tell the app you ${which === "finished" ? "finished" : "have played"} this`;
    btn.addEventListener("click", () => toggleMark(row, which));
    return btn;
  }

  /**
   * Press a toggle. THE STATE SENT IS ALWAYS THE FULL STATE, never a "flip
   * this" - POST /api/marks is an upsert, so a double-click or a retry cannot
   * land the opposite of what was pressed.
   *
   * Pressing "Finished" sets both, because you cannot finish a game you never
   * played; pressing an active "Played" on a finished game clears both. The
   * server normalises the same invariant, so the two can never disagree.
   */
  function toggleMark(row, which) {
    const playedNow = row.played === true;
    const finishedNow = row.finished === true;
    // "STEAM MEASURED IT" IS NOT "THE USER SAID SO". `row.played` is true for
    // both, and re-asserting it on the way out of "Finished" would write a
    // played:1 James never claimed into the one table that cannot be rebuilt
    // from anywhere - invisible on screen, because Steam's evidence outranks a
    // mark in derivePlayed, but GET /api/marks would report it as a mark.
    // Un-marking a game Steam already measured clears the row instead.
    const steamMeasured = typeof row.playedSource === "string" && row.playedSource.startsWith("steam-");
    const assertedPlayed = playedNow && !steamMeasured;
    if (which === "finished") {
      const finished = !finishedNow;
      return writeMark(row, { played: finished || assertedPlayed ? 1 : 0, finished: finished ? 1 : 0 });
    }
    const played = !playedNow;
    return writeMark(row, { played: played ? 1 : 0, finished: played ? (finishedNow ? 1 : 0) : 0 });
  }

  /**
   * Write it, then repaint from what the SERVER SAYS IT STORED.
   *
   * A FAILED WRITE MUST SAY SO. Increment 12's review caught this class four
   * separate ways - an action that silently did nothing while the page implied
   * it had worked - and this is the same defect one lane over: James would
   * believe a game is marked when it is not, and would find it back in his
   * picks tomorrow with no explanation. POST /api/marks fail-softs at HTTP 200
   * with `{saved:false}`, so `res.ok` is NOT the test; the body is.
   */
  async function writeMark(row, wanted) {
    const clearing = wanted.played === 0 && wanted.finished === 0;
    let stored = null;
    try {
      const res = clearing
        ? await fetch(`/api/marks/${encodeURIComponent(row.appid)}`, { method: "DELETE" })
        : await fetch("/api/marks", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ appid: row.appid, name: row.title, ...wanted }),
          });
      const body = res.ok ? await res.json() : null;
      if (clearing) stored = body?.cleared === true ? { played: 0, finished: 0 } : null;
      else stored = body?.saved === true ? { played: body.played, finished: body.finished } : null;
    } catch {
      stored = null;
    }

    if (stored === null) {
      // Nothing was mutated locally, so there is nothing to roll back - the
      // toggles simply re-render in their unchanged state, under a sentence
      // that says the write did not land.
      renderAll();
      showMarkFailure(row, clearing);
      return;
    }

    // Repaint every lens's copy of this row, so switching lens does not show a
    // stale mark. `applyMark` re-derives `playedSource` under the same
    // precedence the server uses - Steam's evidence always outranks a mark.
    for (const [, p] of state.payloads) {
      p.rank = p.rank.map((r) => (r.appid === row.appid ? applyMark(r, stored) : r));
    }
    renderAll();
  }

  /**
   * The visible failure. Wording matches the undo path's sentence, so the page
   * has one voice for "that did not work".
   *
   * IT MUST NAME THE STATE THE GAME IS ACTUALLY IN, and that differs by path.
   * Nothing is mutated on a failure, so a failed CLEAR leaves the game marked
   * and the toggle correctly repaints as pressed - saying "is not marked"
   * under a pressed button is the button and the sentence contradicting each
   * other with the sentence being the false one, which is exactly the class of
   * lie increment 12 spent its review removing.
   */
  function showMarkFailure(row, clearing) {
    raiseToast(el("div", "toast", clearing
      ? `Couldn't clear that – ${row.title} is still marked.`
      : `Couldn't save that – ${row.title} is not marked.`));
  }

  /**
   * Put one thing in the single shared toast host, for 8 seconds.
   *
   * ONE TIMER, because there is one host. Each toast used to arm its own
   * unconditional `setTimeout(...replaceChildren...)`, so dismissing a game
   * within 8 seconds of a failed mark write let the older timer wipe the
   * dismissal toast - and its Undo button - out from under the user.
   */
  let toastTimer = null;
  function raiseToast(node) {
    const host = $("toast");
    clearTimeout(toastTimer);
    host.replaceChildren(node);
    toastTimer = setTimeout(() => { if (host.firstChild === node) host.replaceChildren(); }, 8000);
  }

  /** "Not interested". The card goes immediately and the next pick slides in
   * without a reload; /api/rank already excludes dismissed rows server-side,
   * so a reload keeps it gone (SPEC.md §4.7). */
  async function dismissRow(row) {
    const origin = state.preset;
    for (const [, p] of state.payloads) {
      p.rank = p.rank.filter((r) => r.appid !== row.appid);
    }
    renderPicks();
    renderBrowse();
    showToast(row, origin);
    try {
      await fetch("/api/dismissals", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ appid: row.appid, name: row.title }),
      });
    } catch {
      // Fail-soft: the row is already gone locally; a failed write means it
      // returns on the next reload, which is honest rather than silent.
    }
  }

  function showToast(row, origin) {
    const host = $("toast");
    const line = el("div", "toast", `Dismissed. ${row.title} won't come back. `);
    const undo = el("button", null, "Undo");
    undo.addEventListener("click", async () => {
      // SEC-1: THIS USED TO BE AN UNGUARDED AWAIT. DELETE /api/dismissals
      // fail-softs at HTTP 200 with `{restored:false}`, so a failure neither
      // threw nor was checked: the row stayed dismissed on the server, was
      // never pushed back locally, the toast stayed up, and the user saw
      // nothing at all. dismissRow's POST was already wrapped; these two were
      // the inconsistency.
      let restored = false;
      try {
        const res = await fetch(`/api/dismissals/${encodeURIComponent(row.appid)}`, { method: "DELETE" });
        restored = res.ok && (await res.json())?.restored === true;
      } catch {
        restored = false;
      }
      if (!restored) {
        undo.textContent = "Try again";
        line.append(el("span", null, " Couldn't undo that – it is still dismissed."));
        return;
      }
      // CR-2: RESTORE ONLY INTO THE LENS IT WAS DISMISSED UNDER. `row` carries
      // the `rankScore` of that lens, and re-sorting another lens's array by
      // it would place the game at a position that lens's own blend never
      // produced – the browser inventing a rank, which §4.2 forbids. The other
      // lenses are DROPPED so they re-fetch their own honest order.
      const p = state.payloads.get(origin);
      if (p && !p.rank.some((r) => r.appid === row.appid)) {
        p.rank.push(row);
        p.rank.sort((a, b) => b.rankScore - a.rankScore);   // restore rank ORDER, using the score the API sent
      }
      for (const key of [...state.payloads.keys()]) {
        if (key !== origin) state.payloads.delete(key);
      }
      host.replaceChildren();
      if (!state.payloads.has(state.preset)) {
        // The lens moved while the toast was up, and its payload was just
        // dropped. Re-fetch rather than paint against nothing.
        try {
          await loadPreset(state.preset);
        } catch (err) {
          showFailure(err);
          return;
        }
      }
      renderAll();
    });
    line.append(undo);
    raiseToast(line);
  }

  // -------------------------------------------------------------------------
  // Filter persistence through the existing increment-8 settings lane, under
  // ONE new key holding a JSON blob. GET /api/settings returns only what is
  // stored, so an untouched store yields an unchanged response and there is no
  // zero-diff breach. Failure is silent and never blocks a render.
  //
  // THE PICKS ARE NOT PERSISTED AND NEVER READ THIS. The two chips default off
  // every session, because a persisted filter could poison the landing state
  // and the landing state is the gate (SPEC.md §4.3).
  // -------------------------------------------------------------------------
  let saveTimer = null;
  function saveFilters() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      fetch("/api/settings", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ [RANK_FILTERS_SETTINGS_KEY]: state.filters }),
      }).catch(() => {});
    }, 400);
  }

  async function restoreFilters() {
    try {
      const res = await fetch("/api/settings");
      const { settings = {} } = await res.json();
      state.filters = normaliseFilters(settings[RANK_FILTERS_SETTINGS_KEY]);
    } catch {
      state.filters = { ...DEFAULT_RANK_FILTERS };
    }
    restoreControlsFromState();
  }

  function bindFilters() {
    const change = (fn) => () => {
      fn();
      state.browseShown = BROWSE_PAGE_SIZE;
      renderBrowse();
      saveFilters();
    };
    // Debounce the INPUT, not the filter chain – the chain over 13,924 rows is
    // a handful of milliseconds; it is the keystroke rate that needs damping.
    let searchTimer = null;
    const applySearch = change(() => { state.filters.search = $("f-search").value; });
    $("f-search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applySearch, 150);
    });
    $("f-playstate").addEventListener("change", change(() => { state.filters.playState = $("f-playstate").value; }));
    $("f-ownership").addEventListener("change", change(() => { state.filters.ownership = $("f-ownership").value; }));
    $("f-played").addEventListener("change", change(() => { state.filters.hidePlayed = $("f-played").checked; }));
    $("f-sale").addEventListener("change", change(() => { state.filters.onSaleOnly = $("f-sale").checked; }));
    $("f-discount").addEventListener("change", change(() => { state.filters.minDiscount = Number($("f-discount").value); }));
    $("f-price").addEventListener("change", change(() => { state.filters.maxPrice = $("f-price").value === "" ? null : Number($("f-price").value); }));
    $("f-taste").addEventListener("change", change(() => { state.filters.minTaste = Number($("f-taste").value); }));
    $("f-experience").addEventListener("change", change(() => { state.filters.minExperience = Number($("f-experience").value); }));
    $("f-top100").addEventListener("change", change(() => { state.filters.top100 = $("f-top100").checked; }));
    $("f-reset").addEventListener("click", () => {
      state.filters = { ...DEFAULT_RANK_FILTERS };
      restoreControlsFromState();
      for (const chip of $("f-tags").children) chip.setAttribute("aria-pressed", "false");
      state.browseShown = BROWSE_PAGE_SIZE;
      renderBrowse();
      saveFilters();
    });
    $("browse-more").addEventListener("click", () => { state.browseShown += BROWSE_PAGE_SIZE; renderBrowse(); });
  }

  function restoreControlsFromState() {
    // Built from PLAY_STATES rather than hand-written <option>s, so the four
    // labels James ruled on live in one tested place.
    const playstate = $("f-playstate");
    if (playstate.childElementCount === 0) {
      for (const { value, label } of PLAY_STATES) {
        const option = el("option", null, label);
        option.value = value;
        playstate.append(option);
      }
    }
    playstate.value = state.filters.playState || PLAY_STATE_ALL;
    $("f-search").value = state.filters.search;
    $("f-ownership").value = state.filters.ownership || OWNERSHIP_ALL;
    $("f-played").checked = state.filters.hidePlayed;
    $("f-sale").checked = state.filters.onSaleOnly;
    $("f-discount").value = String(state.filters.minDiscount ?? 0);
    $("f-price").value = state.filters.maxPrice == null ? "" : String(state.filters.maxPrice);
    $("f-taste").value = String(state.filters.minTaste ?? 0);
    $("f-experience").value = String(state.filters.minExperience ?? 0);
    $("f-top100").checked = state.filters.top100;
  }

  function bindChips() {
    // The two chips apply to the PICKS only, and neither is persisted.
    $("chip-owned").addEventListener("change", () => {
      state.chips.hideOwned = $("chip-owned").checked;
      state.picksShown = PICK_COUNT;
      renderPicks();
    });
    $("chip-played").addEventListener("change", () => {
      state.chips.hidePlayed = $("chip-played").checked;
      state.picksShown = PICK_COUNT;
      renderPicks();
    });
    $("show-more").addEventListener("click", () => { state.picksShown += PICK_STEP; renderPicks(); });
  }

  /** The wishlist badge (SPEC.md §4.7). Fired AFTER the picks paint, never
   * awaited by the render, and a failure is silent – it is a badge, and the
   * first thing cut if it ever threatens the gate. */
  function paintWishlist() {
    fetch("/api/wishlist")
      .then((r) => r.json())
      .then(({ wishlist = [] }) => {
        state.wishlist = new Set(wishlist.map((w) => w.appid).filter((id) => id != null));
        if (state.wishlist.size > 0) renderPicks();
      })
      .catch(() => {});
  }

  // -------------------------------------------------------------------------
  // The last-resort net (SEC-5). This is the project's first real client-side
  // app – roughly fifteen event handlers, every one of them able to throw – and
  // an unhandled throw inside a listener leaves the page HALF-PAINTED with
  // nothing but a console entry the reader will never open. Two listeners,
  // painting the `.error` box that already exists.
  // -------------------------------------------------------------------------
  function reportCrash() {
    $("crash").replaceChildren(
      el("p", "error", "Something on this page stopped working, so what you are looking at may be incomplete. Reload to try again."),
    );
  }
  window.addEventListener("error", reportCrash);
  window.addEventListener("unhandledrejection", reportCrash);

  // -------------------------------------------------------------------------
  // Boot. Nothing here needs a click: the landing state is a fetch and a paint.
  // -------------------------------------------------------------------------
  (async function main() {
    bindChips();
    bindFilters();
    showLoading();
    try {
      await restoreFilters();
      await loadPreset(LANDING_PRESET);
      renderAll();
      paintWishlist();
    } catch (err) {
      // SEC-2: "the server may still be starting up" is the message for a
      // fetch that never landed. When /api/rank ANSWERED and said it has no
      // ranking, the server's own notice is printed instead – reloading would
      // never have fixed a missing FPM_DB.
      showFailure(err);
    }
  })();
</script>
